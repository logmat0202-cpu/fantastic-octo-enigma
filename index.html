<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftMarket</title>
    <!-- TON Connect SDK (стабильная версия) -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wallet-float" id="walletFloat">
    <!-- Кнопка подключения -->
    <button id="connectWalletBtn" class="wallet-btn-small">
        🔌 Подключить
    </button>
    
    <!-- Информация о кошельке (скрыта по умолчанию) -->
    <div class="wallet-info" id="walletInfoFloat">
        <div class="wallet-address" id="walletStatusFloat">—</div>
        <div class="wallet-balance" id="walletBalanceFloat">—</div>
        <button id="disconnectWalletBtn" class="wallet-btn-small disconnect">
            🔌 Отключить
        </button>
    </div>
</div>
           
    <div class="container">
        
        <!-- ===== СТРАНИЦА 1: МАГАЗИН ===== -->
        <div id="page-shop" class="page">
            <h2>🛍️ Магазин</h2>
            <p>Здесь будут гифты</p>
        </div>

        <!-- ===== СТРАНИЦА 2: ПВП ===== -->
        <div id="page-pvp" class="page active">
            <h2>⚔️ ПВП</h2>
            <p>Здесь будут бои</p>
        </div>

        <!-- ===== СТРАНИЦА 3: ПРОФИЛЬ ===== -->
        <div id="page-profile" class="page">
            <h2>👤 Профиль</h2>
            <div id="profileInfo">
                <p>Загрузка...</p>
                <!-- ===== БЛОК КОШЕЛЬКА ===== -->
<!-- ========================================= -->
<!-- ПЛАВАЮЩИЙ БЛОК КОШЕЛЬКА (ПРАВЫЙ ВЕРХНИЙ УГОЛ) -->
</div>

         
</div>
        

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <div class="tab-bar">
        <button class="tab-item" data-page="page-shop">
            <span class="tab-icon">🛍️</span>
            Магазин
        </button>
        <button class="tab-item active" data-page="page-pvp">
            <span class="tab-icon">⚔️</span>
            ПВП
        </button>
        <button class="tab-item" data-page="page-profile">
            <span class="tab-icon">👤</span>
            Профиль
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
