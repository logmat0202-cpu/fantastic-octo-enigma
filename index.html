<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftMarket</title>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="container">
        <!-- ===== СТРАНИЦА 1: МАГАЗИН ===== -->
        <div id="page-shop" class="page">
            <h2>🛍️ Магазин</h2>
            <p>Здесь будут гифты</p>
        </div>

        <!-- ===== СТРАНИЦА 2: ПВП ===== -->
        <div id="page-pvp" class="page active">
            <h2>⚔️ ПВП</h2>
            <p>Здесь будут бои</p>
        </div>

        <!-- ===== СТРАНИЦА 3: ПРОФИЛЬ ===== -->
        <div id="page-profile" class="page">
            <h2>👤 Профиль</h2>
            <div id="profileInfo">
                <p>Загрузка...</p>
            </div>
            <!-- ===== БЛОК КОШЕЛЬКА ===== -->
<div class="wallet-section">
    <h3>💳 TON Кошелек</h3>
    
    <button id="connectWalletBtn" class="wallet-btn">
        🔌 Подключить кошелек
    </button>
    
    <div id="walletInfo" style="display: none;">
        <p><strong>Адрес:</strong> <span id="walletStatus"></span></p>
        <p><strong>Баланс:</strong> <span id="walletBalance">—</span></p>
        <button id="disconnectWalletBtn" class="wallet-btn" style="background: #e74c3c;">
            🔌 Отключить
        </button>
    </div>
</div>
        </div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <div class="tab-bar">
        <button class="tab-item" data-page="page-shop">
            <span class="tab-icon">🛍️</span>
            Магазин
        </button>
        <button class="tab-item active" data-page="page-pvp">
            <span class="tab-icon">⚔️</span>
            ПВП
        </button>
        <button class="tab-item" data-page="page-profile">
            <span class="tab-icon">👤</span>
            Профиль
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
