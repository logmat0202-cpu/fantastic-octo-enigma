<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftMarket</title>
    <!-- TON Connect UI -->
    
    <link rel="stylesheet" href="style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<!-- ===== БАЛАНС (ПРАВЫЙ ВЕРХНИЙ УГОЛ) ===== -->
<div id="balanceFloat" style="
    position: fixed;
    top: 62px;
    right: 12px;
    z-index: 99998;
    background: var(--tg-theme-bg-color, #ffffff);
    border-radius: 12px;
    padding: 6px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    border: 1px solid var(--tg-theme-section-separator-color, #e0e0e0);
    font-weight: 600;
    font-size: 14px;
    text-align: center;
    min-width: 100px;
    color: var(--text, #000000);
">
    💰 <span id="balanceFloatText">Загрузка...</span>
</div>
    <!-- ========================================= -->
    <!-- ПЛАВАЮЩИЙ КОШЕЛЕК (UI) — САМЫЙ ПЕРВЫЙ -->
    <!-- ========================================= -->

    <!-- ========================================= -->
    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <!-- ========================================= -->
    <div class="container">

        <!-- СТРАНИЦА 1: МАГАЗИН -->
        <div id="page-shop" class="page">
            <h2>🛍️ Магазин</h2>
            <p>Здесь будут </p>
        </div>

<div id="page-pvp" class="page">
    <h2>⚔️ ПВП Колесо</h2>

    <!-- КОЛЕСО -->
    <div style="text-align: center; margin: 16px 0;">
        <canvas id="wheelCanvas" width="300" height="300" style="
            max-width: 100%;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
        "></canvas>
        <div id="wheelResult" style="
            margin-top: 12px;
            font-weight: 600;
            font-size: 18px;
            min-height: 30px;
            color: var(--text, #000000);
        "></div>
    </div>

    <!-- БАЛАНС -->
    
    <!-- СТАТУС -->
    <div id="pvpStatus" style="
        background: var(--tg-theme-secondary-bg-color, #f0f0f0);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        text-align: center;
    ">Загрузка...</div>

    <!-- СПИСОК ИГРОКОВ -->
    <div id="pvpPlayers" style="
        background: var(--tg-theme-secondary-bg-color, #f0f0f0);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 16px;
        min-height: 60px;
    "></div>

    <!-- СТАВКА (ПОЛЕ ВВОДА) -->
    <div id="betSection" style="
        background: var(--tg-theme-secondary-bg-color, #f0f0f0);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        text-align: center;
    ">
        <div style="display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;">
            <input type="number" id="betInput" value="0.1" step="0.1" min="0.1" style="
                padding: 10px 14px;
                border-radius: 10px;
                border: 1px solid var(--section-separator, #ccc);
                font-size: 16px;
                width: 120px;
                background: var(--bg, #fff);
                color: var(--text, #000);
            ">
            <button onclick="placeBet()" class="bet-btn" style="
                background: var(--tg-theme-button-color, #2481cc);
                color: var(--tg-theme-button-text-color, #ffffff);
                border: none;
                border-radius: 10px;
                padding: 10px 24px;
                font-weight: 600;
                cursor: pointer;
                font-size: 16px;
            ">
                🎯 Сделать ставку
            </button>
        </div>
        <div style="font-size: 12px; color: var(--hint, #999999); margin-top: 6px;">
            Минимальная ставка: 0.1 TON
        </div>
    </div>
</div>

        <!-- СТРАНИЦА 3: ПРОФИЛЬ -->
        <div id="page-profile" class="page">
            <h2>👤 Профиль</h2>
            <div id="profileInfo">
                <p>Загрузка...</p>
            </div>
          
        </div>

    </div>

    <!-- ========================================= -->
    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <!-- ========================================= -->
    <div class="tab-bar">
        <button class="tab-item" data-page="page-shop">
            <span class="tab-icon">🛍️</span>
            Магазин
        </button>
        <button class="tab-item active" data-page="page-pvp">
            <span class="tab-icon">⚔️</span>
            ПВП
        </button>
        <button class="tab-item" data-page="page-profile">
            <span class="tab-icon">👤</span>
            Профиль
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
