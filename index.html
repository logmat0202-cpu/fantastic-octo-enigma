<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css" />

<body>
<script>
const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({

</script>
    <div class="container">

</div>
        
    </div>

        <button class="tab-item" data-page="page-shop">
